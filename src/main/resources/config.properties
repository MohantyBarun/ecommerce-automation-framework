# Every key can be overridden with a JVM system property (-Dbrowser=firefox)
# or an environment variable (BROWSER=firefox).

baseUrl=https://automationexercise.com
apiBaseUrl=https://automationexercise.com/api

# chrome | firefox | edge
browser=chrome
headless=false
# local | remote (Selenium Grid)
execution=local
gridUrl=http://localhost:4444

explicitWait=15
pageLoadTimeout=60

# How many times a failed test is re-run before it is reported as failed
retryCount=1

# Block ad/tracker hosts in Chromium browsers (the practice site is ad-heavy)
blockAds=true
