name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"   # nightly regression on weekdays

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run API suite
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dsuite=src/test/resources/suites/api.xml
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: target/allure-results

  ui:
    name: UI tests (${{ matrix.browser }}, Selenium Grid)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start Selenium Grid
        run: docker compose up -d

      - name: Wait for Grid to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4444/status | grep -q '"ready": *true'; then
              echo "Grid is ready"; exit 0
            fi
            sleep 2
          done
          echo "Grid did not become ready"; docker compose logs; exit 1

      - name: Run UI + hybrid suite on ${{ matrix.browser }}
        run: |
          chmod +x mvnw
          ./mvnw -B test \
            -Dsuite=src/test/resources/suites/ui.xml \
            -Dbrowser=${{ matrix.browser }} \
            -Dexecution=remote \
            -DgridUrl=http://localhost:4444 \
            -Dheadless=true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down

  report:
    name: Allure report
    needs: [api, ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true
      - name: Generate combined Allure report
        run: |
          chmod +x mvnw
          ./mvnw -B allure:report
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
