name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"   # nightly regression on weekdays

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run API suite (TestNG)
        run: |
          chmod +x mvnw
          ./mvnw -B test -DskipBdd=true -Dsuite=src/test/resources/suites/api.xml
      - name: Run API features (Cucumber)
        if: success() || failure()
        run: ./mvnw -B test -DskipTestNG=true "-Dcucumber.filter.tags=@api"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-api
          path: target/allure-results

  ui:
    name: UI tests (${{ matrix.browser }}, Selenium Grid)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start Selenium Grid
        run: docker compose up -d

      - name: Wait for Grid to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4444/status | grep -q '"ready": *true'; then
              echo "Grid is ready"; exit 0
            fi
            sleep 2
          done
          echo "Grid did not become ready"; docker compose logs; exit 1

      # retryCount=2: the public practice site overloads often under CI load
      - name: Run UI + hybrid suite on ${{ matrix.browser }} (TestNG)
        run: |
          chmod +x mvnw
          ./mvnw -B test -DskipBdd=true \
            -Dsuite=src/test/resources/suites/ui.xml \
            -Dbrowser=${{ matrix.browser }} -Dexecution=remote -DgridUrl=http://localhost:4444 \
            -Dheadless=true -DretryCount=2

      - name: Run UI + hybrid features on ${{ matrix.browser }} (Cucumber)
        if: success() || failure()
        run: |
          ./mvnw -B test -DskipTestNG=true "-Dcucumber.filter.tags=not @api" \
            -Dbrowser=${{ matrix.browser }} -Dexecution=remote -DgridUrl=http://localhost:4444 \
            -Dheadless=true -DretryCount=2

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down

  report:
    name: Allure report
    needs: [api, ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Download all Allure results
        uses: actions/download-artifact@v5
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true
      - name: Restore trend history from the published report
        # Allure builds its trend charts from the previous report's history/ folder.
        # On the very first deploy there is none yet, so missing files are fine.
        run: |
          mkdir -p target/allure-results/history
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history"
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$base/$f" -o "target/allure-results/history/$f" || echo "no previous $f"
          done
      - name: Add CI executor info
        run: |
          cat > target/allure-results/executor.json <<EOF
          {"name": "GitHub Actions", "type": "github",
           "buildName": "${{ github.workflow }} #${{ github.run_number }}",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"}
          EOF
      - name: Generate combined Allure report
        run: |
          chmod +x mvnw
          ./mvnw -B allure:report
      - name: Upload Allure report
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
      - name: Upload report for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/allure-maven-plugin

  publish:
    name: Publish report to GitHub Pages
    needs: report
    # Only main publishes; pull requests and feature branches keep the artifact only.
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
